title: josemwarrior # name of the site
author: josemwarrior # name of site's author
email: 23.planner.don@icloud.com # email of site's author
url: https://josemwarrior.github.io # root address of the site
baseurl: "" # subpath of the site, e.g. "/blog" (leave it blank "" if your site does not use a subpath)
description: > # description of the site (multiple lines allowed)
  Web personal con enlaces a mis redes, contacto, portfolio, blog y microblog.

permalink: /:slug.html

# Satomi writes short updates to this collection. Layout, styling, and the
# public index remain owned by this Jekyll site.
collections:
  microblog:
    output: true
    permalink: /microblog/:name/

defaults:
  - scope:
      path: ""
    values:
      image:
        path: /assets/img/avatar-social.jpg
        width: 493
        height: 492
        alt: josemwarrior
  - scope:
      path: ""
      type: microblog
    values:
      layout: microblog-post

favicon: "logo.png" # name+extension of favicon (which must be put on the root folder)
# goat_counter: "yoursitename" # put your GoatCounter name if you want to use GoatCounter analytics

remote_theme: riggraz/no-style-please # if you are using GitHub Pages, change it to remote_theme: riggraz/no-style-please

theme_config:
  appearance: "auto" # can be "light", "dark" or "auto"
  back_home_text: ".." # customize text for homepage link in post layout
  date_format: "%Y-%m-%d" # customize how date is formatted
  show_description: false # show blog description in home page
  lowercase_titles: false # show titles in lowercase in lists

sass:
  style: compressed

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jektex

jektex:
  cache_dir: ".jektex-cache"
  ignore: ["*.xml"]
  silent: false
  macros:
    - ["\\Q", "\\mathbb{Q}"]
    - ["\\C", "\\mathbb{C}"]
